name: Production

on:
  push:
    branches: [production]

permissions:
  contents: write
  deployments: write

jobs:
  release:
    name: GitHub Release (source + data zips)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version tag
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack release zips
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm release:pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            dist-release/*.zip \
            --title "Geo Index ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          SITE: ${{ vars.SITE || 'https://geo-index-8gl.pages.dev' }}
        run: pnpm build

      - name: Deploy production to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=geo-index --branch=production --commit-dirty=true

      - name: Skip Action deploy (Git pull or missing token)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "No CLOUDFLARE_API_TOKEN. If the Pages project is connected to this GitHub repo, Cloudflare will pull the production branch itself."
          echo "Otherwise add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (0e7457e9e732a01a6039f7902c7a7a60) as repository secrets."
