name: Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: v${{ github.run_number }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Pack release zips
        run: pnpm release:pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" dist-release/*.zip --title "Geo Index ${{ steps.version.outputs.version }}" --generate-notes --latest

  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    needs: release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE: ${{ vars.SITE || 'https://geo-index-8gl.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy production to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=geo-index --branch=production --commit-dirty=true

      - name: Skip Action deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN. If Pages is connected to GitHub it will pull this production branch. Otherwise add a Pages-edit API token secret."
